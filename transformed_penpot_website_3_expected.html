<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penpot Website - Bootstrap 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #D3A3A3; /* Single Background Color */
        }
        .content-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 90vh;
            padding-left: 100px; /* Ensures left alignment */
            text-align: left;
        }
        .btn-custom {
            width: 220px;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 15px;
        }
        .btn-learn-more {
            background-color: #8B2A7B; /* Correct Button Color */
            color: white;
        }
        .btn-get-now {
            background-color: #A16262; /* Correct Button Color */
            color: white;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }
        .checkbox-container input {
            width: 18px;
            height: 18px;
        }
        .navbar-nav .nav-link {
            color: white !important; /* Ensures all nav links are white */
        }
    </style>
</head>
<body>

    <!-- Navigation Bar (Fixed Text Color & Removed Extra Text) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Service</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content (Now Left-Aligned) -->
    <div class="container-fluid content-wrapper text-white">
        <h1 class="display-4">Welcome to UIAutomation</h1>
        <p class="lead mt-3">Convert design to code</p>

        <!-- Buttons in Correct Order -->
        <a href="#" class="btn btn-custom btn-learn-more">Learn More</a>
        <a href="#" class="btn btn-custom btn-get-now">Get Now</a>

        <!-- Checkbox and Label at the Bottom -->
        <div class="checkbox-container">
            <input type="checkbox" id="try-it-now">
            <label for="try-it-now" class="fs-5 text-white">Try It Now</label>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 text-white">
        <p>&copy; 2025 UIAutomation. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
